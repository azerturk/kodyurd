name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm exec -- tsc -p packages/ui/tsconfig.json --noEmit
      - run: npm test
      - run: npm --prefix examples/harbor-desk test
